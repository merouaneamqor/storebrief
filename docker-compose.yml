services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store_brief
      POSTGRES_PASSWORD: store_brief
      POSTGRES_DB: store_brief_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_brief -d store_brief_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  web:
    build: .
    command: bash -c "bundle install && bundle exec rails active_admin:bundle_js && bundle exec rails dartsass:build && (bundle exec rails dartsass:watch &) && ./bin/rails db:prepare && ./bin/rails db:seed && ./bin/rails server -b 0.0.0.0 -p 3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3001:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://store_brief:store_brief@db:5432/store_brief_development
      SMTP_ADDRESS: mail
      SMTP_PORT: 1025
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-}
      APP_HOST: ${APP_HOST:-localhost}
      APP_TLD_LENGTH: ${APP_TLD_LENGTH:-0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@storebrief.app}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

volumes:
  postgres_data:
  bundle_cache:
