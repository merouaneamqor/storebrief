      d1_body: "Une consigne réelle, pour une région, dans la langue de cette équipe."
      d2: "Le magasin répond"
      d2_body: "L’équipe coche sur le téléphone et joint la photo."
      d3: "Vous voyez qui relancer"
      d3_body: "Au vert, en attente, à appeler. La même liste pour le siège et la région."
      close_title: "Trente minutes. Vos consignes. Leur langue."
      close_body: "Dites-nous combien de magasins vous avez. On vous montre le parcours sur votre réseau."
      cta: "Réserver une démo"
    fits:
      title: "Si cette matinée est la vôtre"
      lede: "Plusieurs magasins, des procédures qui se répètent, et une équipe au siège ou en région."
      more: "Voir les autres formats"
    faq:
      title: "Avant de réserver"
      q1: "C’est une caisse ou un stock ?"
      a1: "Non. StoreBrief envoie la consigne, la checklist et la photo. Il n’encaisse pas, ne compte pas le stock, et ne remplace pas votre comptabilité."
      q2: "Les équipes peuvent-elles l’utiliser en arabe ?"
      a2: "Oui. Vous écrivez la même consigne en français et en arabe. L’arabe s’affiche de droite à gauche."
      q3: "Et si le magasin n’a pas de réseau ?"
      a3: "L’équipe peut terminer la checklist sur le téléphone. Elle part quand le réseau revient."
      q4: "On fait quoi, concrètement, pendant la démo ?"
      a4: "Trente minutes. On prend une consigne que vous envoyez déjà, on la montre sur le téléphone du magasin, et on vous montre quels magasins appeler."
      q5: "Faut-il l’installer dans tout le réseau ?"
      a5: "Non. On commence par une procédure et un petit groupe de magasins. Vous décidez ensuite."
    prospects:
      title: "Les formats qui conviennent"
      lede: "StoreBrief convient surtout aux enseignes qui ont plusieurs magasins, des procédures qui se répètent, et une équipe siège ou régionale."
      strongest: "Là où c’est le plus clair"
      adjacent_title: "Ça convient aussi"
      close: "Le plus simple pour commencer : alimentaire, mode, beauté ou franchise, avec une équipe au siège ou en région. On part d’une consigne, d’une checklist, et de la photo."
      items:
        - title: "Supermarchés et chaînes alimentaires"
          body: "Contrôles magasin, promotions, propreté, tâches de sécurité alimentaire, et preuve photo."
        - title: "Mode et habillement"
          body: "Standards de merchandising, déploiements de campagne, mises en place de collections, et visites magasin."
        - title: "Beauté et cosmétique"
          body: "Présentations produit, lancements, consignes aux équipes, et contrôles de conformité."
        - title: "Électronique et électroménager"
          body: "Installation produit, consignes promotionnelles, audits magasin, et remontée d’incidents."
        - title: "Meuble et équipement de la maison"
          body: "Standards de showroom, contrôles de présentation, signalement de livraison ou de maintenance."
        - title: "Pharmacies et chaînes santé-beauté"
          body: "Checklists opérationnelles, communication aux équipes, et inspections magasin."
        - title: "Convenience et boutiques de stations"
          body: "Contrôles d’ouverture et de fermeture, promotions, et inspections de site."
        - title: "Sport et chaussure"
          body: "Campagnes saisonnières, merchandising visuel, et suivi des tâches magasin."
        - title: "Télécom et téléphonie"
          body: "Consignes de campagne, standards de présentation, et suivi par point de vente."
        - title: "Réseaux de franchise"
          body: "Procédures et communications cohérentes entre des points de vente exploités indépendamment."
      adjacent:
        - title: "Restauration rapide et cafés"
          body: "Checklists quotidiennes, lancements, propreté, et inspections de site."
        - title: "Hôtels et services multi-sites"
          body: "Tâches d’équipe, inspections, et communications opérationnelles."
