    trust:
      title: "Le tissu conjonctif du retail."
      body: "En tchèque, vazivo signifie tissu conjonctif — ce qui tient un corps ensemble. Vazivo fait de même pour le retail : il relie siège, régions, magasins, équipes, tâches et résultats dans un seul flux. Un seul endroit pour transformer les consignes en exécution — ni une caisse, ni un outil de stock."
    problems:
      title: "Arrêtez de piloter vos magasins par messagerie et tableurs."
      p1_title: "Les tâches se perdent"
      p1_body: "Les consignes vivent dans les messageries, les e-mails et les tableurs. Les magasins n’ont pas la même définition de « fait »."
      p2_title: "Les managers relancent toute la journée"
      p2_body: "Les relances remplacent les priorités. Personne n’a une seule liste pour aujourd’hui."
      p3_title: "Le siège manque de visibilité"
      p3_body: "Difficile de voir quels magasins ont terminé, lesquels sont en retard, et où intervenir. Vazivo relie le tout."
    walkthrough:
      title: "Des consignes à l’exécution."
      example: "Magasin Nord et Magasin Centre ont envoyé la photo. Magasin Est pas encore."
      step1: "Planifier"
      step1_body: "Le siège fixe ce qui compte pour le réseau : une info, une tâche ou une checklist, pour un magasin, une ville ou une région."
      step2: "Assigner"
      step2_body: "Les bons magasins et les bonnes personnes reçoivent une liste claire. Ouverture, fermeture, promo, visite : les modèles sont prêts."
      step3: "Exécuter"
      step3_body: "Les équipes réalisent le travail sur place, sur le téléphone. Si le réseau coupe, la checklist se termine quand même et se synchronise dès qu’il revient."
      step4: "Vérifier"
      step4_body: "Photos et avancement montrent ce qui est fait — et ce qui reste. Le siège et la région voient quels magasins relancer."
    benefits:
      title: "Ce qui change quand les opérations sont connectées"
      b1_title: "Chaque tâche. Chaque magasin."
      b1_body: "Envoyez une info, une tâche ou une checklist à un magasin, une ville ou une région. Des modèles prêts pour l’ouverture, la fermeture, la promo et les visites."
      b2_title: "Sachez ce qui s’est vraiment passé."
      b2_body: "Avancement, photos et notes sur chaque point. Fini les « c’est fait ? »."
      b3_title: "Une seule vue sur tous les sites."
      b3_body: "Suivez l’avancement par magasin et par région sans appeler chaque site."
    roles:
      title: "Le bon message pour chaque rôle"
      hq_title: "Siège et direction"
