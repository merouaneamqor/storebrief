      body: "Vous envoyez la consigne aux magasins concernés. L’équipe la termine sur le téléphone, avec la photo. Le siège voit qui a fini, et qui appeler. Les ventes et le stock restent dans vos outils."
    problems:
      title: "Ce qui se passe encore dans trop de réseaux"
      p1_title: "La consigne part. Vous ne savez pas qui l’a vue."
      p1_body: "Groupes, e-mails, messages régionaux : l’info circule. Le magasin de Marrakech n’a pas forcément la même version que celui de Tanger."
      p2_title: "Le standard dépend de qui est de service."
      p2_body: "Ouverture, vitrine, promo, propreté. Sans une liste simple et une photo, vous découvrez l’écart trop tard."
      p3_title: "Vous pilotez au téléphone, magasin après magasin."
      p3_body: "Les managers relancent. Le siège attend. Personne n’a la même liste de ce qui est fait et de ce qui reste."
