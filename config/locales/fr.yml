      title: "Vous reconnaissez votre réseau."
      lede: "Un siège, des régions, des standards à tenir chaque matin. Et des consignes qui se perdent encore dans les groupes."
      fits_title: "Quatre réseaux. La même journée."
      fit1_kicker: "Alimentaire"
      fit1_title: "L’ouverture est faite. Vous le voyez."
      fit1_body: "Promo, propreté, mise en rayon : la photo remonte avant que le manager ait à appeler."
      fit2_kicker: "Mode et beauté"
      fit2_title: "La vitrine est en place, ou vous le savez avant midi."
      fit2_body: "La campagne et la présentation, magasin par magasin. La photo clôt la discussion."
      fit3_kicker: "Restauration"
      fit3_title: "La procédure tient, même sans wifi."
      fit3_body: "Ouverture et fermeture se terminent sur le téléphone du magasin, puis remontent dès que le réseau revient."
      fit4_kicker: "Franchise"
      fit4_title: "La même consigne, de Tanger à Lagouira."
      fit4_body: "Tout le territoire, une seule consigne. Vous voyez qui a suivi, du nord jusqu’au sud."
      demo_title: "En démo, on rejoue votre matinée."
      demo_lede: "Une consigne que vous envoyez déjà, dans la langue du magasin, jusqu’à la photo."
