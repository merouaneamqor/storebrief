      step2_body: "Ouverture, fermeture, promo, visite : le modèle est prêt. L’équipe coche et photographie."
      step3: "Le travail se fait sur place"
      step3_body: "Sur le téléphone. Si le réseau coupe, la checklist se termine quand même et remonte dès qu’il revient."
      step4: "Vous voyez qui a terminé"
      step4_body: "Le siège et la région voient les magasins au vert, et ceux qu’il faut appeler ce matin."
    benefits:
      title: "Ce que vous voyez dès la première semaine"
      b1_title: "La bonne consigne, aux bons magasins"
      b1_body: "Un magasin, une ville ou une région. En français et en arabe. Pas un message perdu dans un groupe."
      b2_title: "La checklist tient dans la main"
      b2_body: "Ouverture, vitrine, promo, visite. L’équipe coche sur le téléphone. Si le réseau coupe, le travail remonte dès qu’il revient."
      b3_title: "La photo tranche"
      b3_body: "Vous ne redemandez plus « c’est fait ? ». Vous voyez la vitrine, et les magasins encore en attente."
