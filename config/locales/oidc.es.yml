es:
  oidc:
    title: "Acceso OpenID Connect"
    help: "Configure el emisor, el cliente y los puntos HTTPS del proveedor de identidad. El administrador de la plataforma debe habilitar OIDC."
    policy: "Solo acceden identidades verificadas. Se deniegan cuentas sin correspondencia y se revocan sus permisos SSO anteriores. Las membresías manuales se conservan. Las cuentas de sede predeterminadas requieren un enlace explícito."
    callback: "Registre esta URL exacta de retorno en el proveedor"
    secret_help: "El secreto se cifra y nunca se muestra. Déjelo vacío para conservar el valor guardado."
    mapping_help: "Asocie una afirmación firmada con una unidad y un rol de trabajo, o con un rol personalizado. Los grupos nunca crean permisos de sede predeterminados."
    save: "Guardar"
    saved: "Guardado."
    links: "Enlaces de identidad"
    link_help: "Enlace una cuenta existente con el sujeto exacto del emisor antes del primer acceso, especialmente para administradores de sede. El correo verificado debe coincidir. Desvincular revoca solo permisos gestionados por SSO."
    user: "Usuario"
    subject: "Sujeto del emisor"
    link: "Enlazar identidad"
    unlink: "Desvincular identidad"
    invalid_link: "La identidad o cuenta ya está enlazada, o el enlace no es válido."
    sign_in: "Acceder con OpenID Connect"
    fields:
      enabled: "Habilitar OIDC"
      sso_enforced: "Exigir SSO en lugar de contraseña"
      jit_enabled: "Permitir creación en el primer acceso"
      issuer: "URL del emisor"
      client_id: "ID de cliente"
      client_secret: "Secreto de cliente"
      authorization_endpoint: "Punto de autorización"
      token_endpoint: "Punto de tokens"
      jwks_uri: "URL JWKS"
      role_mappings_json: "Correspondencias de roles en JSON"
