en:
  oidc:
    title: "OpenID Connect SSO"
    help: "Configure the issuer, client and HTTPS endpoints supplied by your identity provider. The tenant OIDC feature must be enabled by the platform administrator."
    policy: "Only verified identities can sign in. Unmapped accounts are denied and old SSO grants are revoked. Manual memberships remain unchanged. Default HQ accounts require an explicit identity link before SSO."
    callback: "Register this exact callback URL with the provider"
    secret_help: "The secret is encrypted and never shown. Leave blank to keep the saved value."
    mapping_help: "Map a signed claim value to a tenant unit and a workflow role, or to a custom tenant role. Default HQ grants are never created by group mapping."
    save: "Save"
    saved: "Saved."
    links: "Identity links"
    link_help: "Link an existing account to the exact issuer subject before its first login, especially for HQ admins. The verified email must match. Unlinking revokes SSO-managed grants only."
    user: "User"
    subject: "Issuer subject"
    link: "Link identity"
    unlink: "Unlink identity"
    invalid_link: "This identity or account is already linked, or the link is invalid."
    sign_in: "Sign in with OpenID Connect"
    fields:
      enabled: "Enable OIDC"
      sso_enforced: "Require SSO instead of password login"
      jit_enabled: "Allow just-in-time user creation"
      issuer: "Issuer URL"
      client_id: "Client ID"
      client_secret: "Client secret"
      authorization_endpoint: "Authorization endpoint"
      token_endpoint: "Token endpoint"
      jwks_uri: "JWKS URL"
      role_mappings_json: "Role mapping JSON"
