    hero:
      brand: "Vazivo"
      kicker: "Czech for connective tissue"
      title: "The tissue that holds your stores together."
      lede: "In biology, connective tissue supports, binds, and protects. Vazivo does that for multi-store retail: one instruction from head office, every store finishes it on the phone, and you see the proof."
      demo: "Book a demo"
      explore: "See this morning"
