      f2: "Today's task fits on a phone, even when the network is weak."
      f3: "The store sends the photo. You see whether the window, the promo, or the standard is in place."
      f4: "You speak to one store, one city, or a whole region. Not the entire network at once."
      f5: "The checklist finishes in the store, even offline, and comes up when the network returns."
      f6: "A short message tells the team a task is waiting, with the link to do it in StoreBrief."
      f7: "Different instructions by region, with photo follow-up down to the last store."
      f8: "Short training for new joiners and new procedures, with who finished."
