      a: "Français, English, Español, العربية"
      b: "Built for the phone"
      c: "The photo is the proof"
      d: "It holds without a network"
    trust:
      title: "Named for what holds a body together."
      body: "Vazivo is the Czech word for fibrous connective tissue — the structure that supports, binds, protects, and keeps other tissues in place. Your store network needs the same: instructions that reach the right places, work that finishes on the floor, and proof head office can trust — without replacing your cash register or stock tools."
    problems:
      title: "What still happens in too many networks"
      p1_title: "The instruction goes out. You don't know who saw it."
      p1_body: "Groups, email, regional messages: the news moves. The Marrakech store does not always have the same version as Tangier."
      p2_title: "The standard depends on who is on shift."
      p2_body: "Opening, window, promo, cleanliness. Without a simple list and a photo, you find the gap too late."
      p3_title: "You manage by phone, store after store."
      p3_body: "Managers chase. Head office waits. Nobody shares the same list of what is done and what is left."
    walkthrough:
      title: "From the instruction to the proof, the same day"
      example: "Maarif and Agdal sent the photo. Tangier has not yet."
      step1: "You say what matters"
      step1_body: "A note or a task, in the team's language, for one store, a city, or a region."
      step2: "The store has a clear list"
      step2_body: "Opening, closing, promo, visit: the template is ready. The team checks and photographs."
      step3: "The work happens on site"
      step3_body: "On the phone. If the network drops, the checklist still finishes and comes back when it returns."
      step4: "You see who finished"
      step4_body: "Head office and the region see the stores on track, and the ones to call this morning."
    benefits:
      title: "What you see in the first week"
      b1_title: "The right instruction, to the right stores"
      b1_body: "One store, one city, or a region. In French and Arabic. Not a message lost in a group."
      b2_title: "The checklist fits in one hand"
      b2_body: "Opening, window, promo, visit. The team checks it on the phone. If the network drops, the work comes back when it returns."
      b3_title: "The photo settles it"
      b3_body: "You stop asking “is it done?”. You see the window, and which stores are still waiting."
    roles:
      title: "Each role gets what they need"
      hq_title: "Leadership and head office"
      hq_body: "One instruction for the stores that need it, and proof the standard is held."
      region_title: "Regional managers"
      region_body: "You know which stores finished, and which to call before noon."
      store_title: "Store teams"
      store_body: "The day's priorities, in their language, without hunting through a group chat."
    demo:
      title: "See it on your network"
      lede: "Tell us how many stores you have. We walk the path in the language you choose, on your instructions."
      point1: "Your instructions, in each team's language"
      point2: "The photo checklist, on the store phone"
      point3: "The follow-up: on track, waiting, to call"
      name: "Name"
      company: "Brand"
      email: "Work email"
      phone: "Phone"
      stores: "Number of stores"
      language: "Demo language"
      submit: "I want to see a demo"
      success: "Thank you. We'll come back to schedule the demo."
      contact_hint: "Email or phone: one of the two is enough."
      reassure: "30 minutes. One instruction you already send. Nothing to install for the demo."
    footer:
      tagline: "Vazivo — connective tissue for retail networks."
    resources:
      title: "You will recognize your network."
      lede: "A head office, regions, standards to hold every morning. And instructions that still get lost in group chats."
      fits_title: "Four networks. The same day."
      fit1_kicker: "Grocery"
      fit1_title: "Opening is done. You see it."
      fit1_body: "Promo, cleanliness, shelf: the photo comes back before the manager has to call."
      fit2_kicker: "Fashion and beauty"
      fit2_title: "The window is in place, or you know before noon."
      fit2_body: "The campaign and the display, store by store. The photo ends the debate."
      fit3_kicker: "Restaurants"
      fit3_title: "The procedure holds, even without wifi."
      fit3_body: "Opening and closing finish on the store phone, then come back as soon as the network returns."
      fit4_kicker: "Franchise"
      fit4_title: "The same instruction, from Tangier to Lagouira."
      fit4_body: "The whole territory, one instruction. You see who followed, from north to south."
      demo_title: "In the demo, we replay your morning."
      demo_lede: "An instruction you already send, in the store's language, through to the photo."
      d1: "You send"
      d1_body: "A real instruction, for a region, in that team's language."
      d2: "The store answers"
      d2_body: "The team checks it on the phone and attaches the photo."
      d3: "You see who to follow up"
      d3_body: "On track, waiting, to call. The same list for head office and the region."
      close_title: "Thirty minutes. Your instructions. Their language."
      close_body: "Tell us how many stores you have. We show the path on your network."
      cta: "Book a demo"
    fits:
      title: "If this is your morning"
      lede: "Several stores, procedures that repeat, and a head-office or regional team."
      more: "See other formats"
    faq:
      title: "Before you book"
      q1: "Is this a cash register or an inventory system?"
      a1: "No. Vazivo sends the instruction, the checklist, and the photo. It does not take payment, count stock, or replace your accounting."
      q2: "Can store teams use it in Arabic?"
      a2: "Yes. You write the same instruction in French and Arabic. Arabic displays right to left."
      q3: "What if the store has no connection?"
      a3: "The team can finish the checklist on the phone. It is sent when the network comes back."
      q4: "What do we actually do in the demo?"
      a4: "Thirty minutes. We take one instruction you already send, show it on a store phone, and show you which stores to call."
      q5: "Do we have to roll this out to every store?"
      a5: "No. Start with one procedure and a small group of stores. You decide after that."
    prospects:
      title: "Formats that fit"
      lede: "Vazivo is the best fit for retailers with multiple branches, repeatable store procedures, and a head-office or regional operations team."
      strongest: "Where it is clearest"
      adjacent_title: "Also a fit"
      close: "The simplest place to start is grocery, fashion, beauty, or franchise, with a head-office or regional team. You begin with one instruction, a checklist, and the photo."
      items:
        - title: "Supermarkets and grocery chains"
          body: "Store checks, promotions, cleanliness, food-safety tasks, and photo evidence."
        - title: "Fashion and clothing chains"
          body: "Merchandising standards, campaign rollouts, new collection displays, and store visits."
        - title: "Beauty and cosmetics retailers"
          body: "Product displays, launch campaigns, staff guidance, and compliance checks."
        - title: "Electronics and appliance stores"
          body: "Product setup, promotional instructions, store audits, and issue reporting."
        - title: "Furniture and home-goods retailers"
          body: "Showroom standards, display checks, and delivery or maintenance issue reporting."
        - title: "Pharmacies and health-and-beauty chains"
          body: "Operational checklists, staff communications, and store inspections."
        - title: "Convenience stores and fuel-station shops"
          body: "Opening and closing checks, promotions, and site inspections."
        - title: "Sports and footwear retailers"
          body: "Seasonal campaigns, visual merchandising, and store task tracking."
        - title: "Telecom and mobile-phone shops"
          body: "Campaign instructions, display standards, and branch-level follow-up."
        - title: "Franchise networks"
          body: "Consistent procedures and communications across independently operated locations."
      adjacent:
        - title: "Quick-service restaurants and cafés"
          body: "Daily checklists, launches, cleanliness, and location inspections."
        - title: "Hotels and multi-site service businesses"
          body: "Team tasks, inspections, and operational communications."
