      title: "From the instruction to the proof, the same day"
      step1: "You say what matters"
      step1_body: "A note or a task, in the team's language, for one store, a city, or a region."
      step2: "The store has a clear list"
      step2_body: "Opening, closing, promo, visit: the template is ready. The team checks and photographs."
      step3: "The work happens on site"
      step3_body: "On the phone. If the network drops, the checklist still finishes and comes back when it returns."
      step4: "You see who finished"
      step4_body: "Head office and the region see the stores on track, and the ones to call this morning."
