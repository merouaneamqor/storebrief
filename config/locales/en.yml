      kicker: "Less chasing. More doing."
      title: "Run every store from one place."
      lede: "Vazivo helps retail teams organize, assign, execute, and track daily store operations — across every location."
      demo: "Book a demo"
      explore: "See how it works"
      example: "Example · this morning"
      scene_title: "Opening"
