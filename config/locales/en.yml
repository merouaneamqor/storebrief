      task_open: "Promo prices"
    proof:
      a: "Multilingual"
      b: "Built for the phone"
      c: "Photo as proof"
      d: "Works offline when needed"
    trust:
      title: "The connective tissue of retail."
      body: "In Czech, vazivo means connective tissue — what holds a body together. Vazivo does the same for retail: it connects HQ, regions, stores, teams, tasks, and results in one workflow. One place to turn instructions into execution — not a cash register or a stock system."
    problems:
      title: "Stop managing stores through chat and spreadsheets."
      p1_title: "Tasks get lost"
      p1_body: "Instructions live in chat, email, and spreadsheets. Stores don't share one version of “done.”"
      p2_title: "Managers chase all day"
      p2_body: "Follow-ups replace priorities. Nobody has one list for today."
      p3_title: "HQ lacks visibility"
      p3_body: "It's hard to see which stores finished, which are overdue, and where to step in. Vazivo connects it all."
    walkthrough:
      title: "From instructions to execution."
      example: "Store North and Store Central sent the photo. Store East has not yet."
      step1: "Plan"
      step1_body: "HQ sets what matters for the network: a note, a task, or a checklist, for one store, a city, or a region."
      step2: "Assign"
      step2_body: "The right stores and people get a clear list. Opening, closing, promo, visit: the templates are ready."
      step3: "Execute"
      step3_body: "Teams complete the work on site, on the phone. If the network drops, the checklist still finishes and syncs when it returns."
      step4: "Verify"
      step4_body: "Photos and completion show what's done — and what's left. HQ and regions see which stores to follow up."
    benefits:
      title: "What changes when operations are connected"
      b1_title: "Every task. Every store."
      b1_body: "Send a note, a task, or a checklist to one store, a city, or a region. Ready-made templates for opening, closing, promo, and visits."
      b2_title: "Know what actually happened."
      b2_body: "Completion, photos, and notes on every item. No more asking “is it done?”"
      b3_title: "One view across locations."
      b3_body: "See progress by store and region without calling each site."
    roles:
      title: "The right message for every role"
      hq_title: "HQ and leadership"
      hq_body: "Standardize operations across every location — and know what's happening in every store."
      region_title: "Regional managers"
      region_body: "Manage dozens of stores without chasing people."
      store_title: "Store teams"
      store_body: "Know exactly what needs to be done today. The day's work in one place."
    demo:
      title: "See it on your network"
      lede: "Tell us how many stores you run. We'll walk one real instruction through to proof."
      point1: "Organize and assign"
      point2: "Execute on the store phone"
      point3: "Track completion across locations"
      name: "Name"
      company: "Brand"
      email: "Work email"
      phone: "Phone"
      stores: "Number of stores"
      language: "Demo language"
      submit: "Book a demo"
      success: "Thank you. We'll come back to schedule the demo."
      contact_hint: "Email or phone: one of the two is enough."
      reassure: "30 minutes. One instruction you already send. Nothing to install for the demo."
    footer:
      tagline: "Vazivo — Retail operations, connected."
    resources:
      title: "You will recognize your network."
      lede: "Many stores. Repeatable procedures. Too many channels. One operational system."
      fits_title: "Four networks. The same day."
      fit1_kicker: "Grocery"
      fit1_title: "Opening is done. You see it."
      fit1_body: "Promo, cleanliness, shelf: the photo comes back before the manager has to call."
      fit2_kicker: "Fashion and beauty"
      fit2_title: "The window is in place, or you know before noon."
      fit2_body: "The launch and the display, store by store. The photo ends the debate."
      fit3_kicker: "Restaurants"
      fit3_title: "The procedure holds, even without wifi."
      fit3_body: "Opening and closing finish on the store phone, then sync as soon as the network returns."
      fit4_kicker: "Franchise"
      fit4_title: "The same instruction, in every location."
      fit4_body: "Every franchisee, one instruction. You see who followed, site by site."
      demo_title: "In the demo, we replay your morning."
      demo_lede: "An instruction you already send, in the store's language, through to the photo."
      d1: "You send"
      d1_body: "A real instruction, for a region, in that team's language."
      d2: "The store answers"
      d2_body: "The team checks it on the phone and attaches the photo."
      d3: "You see who to follow up"
      d3_body: "On track, waiting, to call. The same list for HQ and the region."
      close_title: "Thirty minutes. Your instructions. Their language."
      close_body: "Tell us how many stores you run. We'll walk one real instruction through to proof."
      cta: "Book a demo"
    fits:
      title: "If this is your morning"
      lede: "Several stores, procedures that repeat, and an HQ or regional team."
      more: "See other formats"
    faq:
      title: "Before you book"
      q1: "Is this a cash register or an inventory system?"
      a1: "No. Vazivo organizes instructions, checklists, and photo proof. It does not take payments, count stock, or replace your accounting."
      q2: "Which languages does it support?"
      a2: "The app is available in French, English, Spanish, and Arabic. Instructions are written in French and Arabic, and Arabic displays right to left."
      q3: "What if a store has no connection?"
      a3: "The team can finish the checklist on the phone. It syncs as soon as the network returns."
      q4: "What happens in the demo?"
      a4: "Thirty minutes. We take one instruction you already send, run it on a store phone, and show you which stores are done and which need follow-up."
      q5: "Do we have to roll this out to every store?"
      a5: "No. Start with one procedure and a small group of stores. You decide after that."
    prospects:
      title: "Formats that fit"
      lede: "Vazivo is the best fit for retailers with multiple locations, repeatable store procedures, and an HQ or regional operations team."
      strongest: "Where it is clearest"
      adjacent_title: "Also a fit"
      close: "The simplest place to start is grocery, fashion, beauty, or franchise, with an HQ or regional team. You begin with one instruction, a checklist, and the photo."
      items:
        - title: "Supermarkets and grocery chains"
          body: "Store checks, promotions, cleanliness, food-safety tasks, and photo evidence."
        - title: "Fashion and clothing chains"
          body: "Merchandising standards, promotion and launch rollouts, new collection displays, and store visits."
        - title: "Beauty and cosmetics retailers"
          body: "Product displays, launch instructions, staff guidance, and compliance checks."
        - title: "Electronics and appliance stores"
          body: "Product setup, promotional instructions, store audits, and issue reporting."
        - title: "Furniture and home-goods retailers"
          body: "Showroom standards, display checks, and delivery or maintenance issue reporting."
        - title: "Pharmacies and health-and-beauty chains"
          body: "Operational checklists, staff communications, and store inspections."
        - title: "Convenience stores and fuel-station shops"
          body: "Opening and closing checks, promotions, and site inspections."
        - title: "Sports and footwear retailers"
          body: "Seasonal promotions, visual merchandising, and store task tracking."
        - title: "Telecom and mobile-phone shops"
          body: "Promotion instructions, display standards, and branch-level follow-up."
        - title: "Franchise networks"
          body: "Consistent procedures and communications across independently operated locations."
      adjacent:
        - title: "Quick-service restaurants and cafés"
          body: "Daily checklists, launches, cleanliness, and location inspections."
        - title: "Hotels and multi-site service businesses"
          body: "Team tasks, inspections, and operational communications."
