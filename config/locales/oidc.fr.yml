fr:
  oidc:
    title: "Connexion OpenID Connect"
    help: "Configurez l’émetteur, le client et les points d’accès HTTPS fournis par votre fournisseur d’identité. La fonction OIDC doit être activée par l’administrateur de la plateforme."
    policy: "Seules les identités vérifiées peuvent se connecter. Les comptes sans correspondance sont refusés et leurs anciens droits SSO sont révoqués. Les adhésions manuelles restent inchangées. Les comptes siège par défaut nécessitent une liaison explicite."
    callback: "Enregistrez cette URL de retour exacte chez le fournisseur"
    secret_help: "Le secret est chiffré et n’est jamais affiché. Laissez le champ vide pour conserver sa valeur."
    mapping_help: "Associez une valeur de revendication signée à une unité et un rôle métier, ou à un rôle personnalisé. Les groupes ne créent jamais de droits siège par défaut."
    save: "Enregistrer"
    saved: "Enregistré."
    links: "Liaisons d’identité"
    link_help: "Liez un compte existant au sujet exact de l’émetteur avant sa première connexion, notamment pour les administrateurs siège. L’adresse vérifiée doit correspondre. La suppression révoque uniquement les droits gérés par le SSO."
    user: "Utilisateur"
    subject: "Sujet de l’émetteur"
    link: "Lier l’identité"
    unlink: "Délier l’identité"
    invalid_link: "Cette identité ou ce compte est déjà lié, ou la liaison est invalide."
    sign_in: "Se connecter avec OpenID Connect"
    fields:
      enabled: "Activer OIDC"
      sso_enforced: "Exiger le SSO au lieu du mot de passe"
      jit_enabled: "Autoriser la création à la première connexion"
      issuer: "URL de l’émetteur"
      client_id: "Identifiant client"
      client_secret: "Secret client"
      authorization_endpoint: "Point d’autorisation"
      token_endpoint: "Point de jetons"
      jwks_uri: "URL JWKS"
      role_mappings_json: "Correspondances des rôles en JSON"
