    faq:
      title: "Antes de reservar"
      q1: "¿Es una caja o un sistema de inventario?"
      a1: "No. Vazivo organiza instrucciones, checklists y pruebas fotográficas. No cobra, no cuenta el stock y no sustituye su contabilidad."
      q2: "¿Qué idiomas admite?"
      a2: "La aplicación está disponible en francés, inglés, español y árabe. Las instrucciones se escriben en francés y en árabe, y el árabe se muestra de derecha a izquierda."
      q3: "¿Y si una tienda no tiene conexión?"
      a3: "El equipo puede terminar la checklist en el teléfono. Se sincroniza en cuanto vuelve la red."
      q4: "¿Qué pasa en la demo?"
      a4: "Treinta minutos. Tomamos una instrucción que ya envía, la ejecutamos en el teléfono de una tienda y le mostramos qué tiendas terminaron y cuáles necesitan seguimiento."
      q5: "¿Hay que implantarlo en toda la red?"
      a5: "No. Se empieza por un procedimiento y un grupo pequeño de tiendas. Usted decide después."
