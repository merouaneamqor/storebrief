      fits_title: "Cuatro redes. El mismo día."
      fit1_kicker: "Alimentación"
      fit1_title: "La apertura está hecha. Usted lo ve."
      fit1_body: "Promo, limpieza, lineal: la foto vuelve antes de que el responsable tenga que llamar."
      fit2_kicker: "Moda y belleza"
      fit2_title: "El escaparate está listo, o lo sabe antes del mediodía."
