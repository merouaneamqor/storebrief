    fits:
      title: "Si esta mañana es la suya"
      lede: "Varias tiendas, procedimientos que se repiten, y un equipo de sede o de región."
      more: "Ver otros formatos"
    faq:
      title: "Antes de reservar"
      q1: "¿Es una caja o un inventario?"
      a1: "No. StoreBrief envía la consigna, la lista y la foto. No cobra, no cuenta el stock y no sustituye su contabilidad."
      q2: "¿Los equipos pueden usarlo en árabe?"
      a2: "Sí. Escribe la misma consigna en francés y en árabe. El árabe se muestra de derecha a izquierda."
      q3: "¿Y si la tienda no tiene red?"
      a3: "El equipo puede terminar la lista en el teléfono. Se envía cuando vuelve la red."
      q4: "¿Qué hacemos, en concreto, en la demo?"
      a4: "Treinta minutos. Tomamos una consigna que ya envía, la mostramos en el teléfono de la tienda y le mostramos a qué tiendas llamar."
      q5: "¿Hay que instalarlo en toda la red?"
      a5: "No. Se empieza por un procedimiento y un grupo pequeño de tiendas. Usted decide después."
    prospects:
      title: "Formatos que encajan"
      lede: "StoreBrief encaja sobre todo en enseñas con varias tiendas, procedimientos que se repiten, y un equipo de sede o de operaciones regionales."
      strongest: "Donde es más claro"
      adjacent_title: "También encaja"
      close: "Lo más simple para empezar: alimentación, moda, belleza o franquicia, con un equipo de sede o de región. Se parte de una consigna, una lista y la foto."
      items:
        - title: "Supermercados y cadenas de alimentación"
          body: "Controles de tienda, promociones, limpieza, tareas de seguridad alimentaria y prueba fotográfica."
        - title: "Moda y ropa"
          body: "Estándares de merchandising, despliegue de campañas, exposiciones de colección y visitas a tienda."
        - title: "Belleza y cosmética"
          body: "Expositores, lanzamientos, indicaciones al equipo y controles de cumplimiento."
        - title: "Electrónica y electrodomésticos"
          body: "Montaje de producto, instrucciones promocionales, auditorías de tienda y reporte de incidencias."
        - title: "Mueble y hogar"
          body: "Estándares de showroom, controles de exposición y reporte de entregas o mantenimiento."
        - title: "Farmacias y cadenas de salud y belleza"
          body: "Checklists operativas, comunicación al equipo e inspecciones de tienda."
        - title: "Tiendas de conveniencia y estaciones de servicio"
          body: "Controles de apertura y cierre, promociones e inspecciones de sitio."
        - title: "Deporte y calzado"
          body: "Campañas de temporada, visual merchandising y seguimiento de tareas."
        - title: "Telecom y telefonía"
          body: "Instrucciones de campaña, estándares de exposición y seguimiento por tienda."
        - title: "Redes de franquicia"
          body: "Procedimientos y comunicaciones coherentes entre locales operados de forma independiente."
      adjacent:
        - title: "Restauración rápida y cafeterías"
          body: "Checklists diarias, lanzamientos, limpieza e inspecciones de local."
        - title: "Hoteles y servicios en varios sitios"
          body: "Tareas de equipo, inspecciones y comunicaciones operativas."
