    trust:
      title: "El tejido conectivo del retail."
      body: "En checo, vazivo significa tejido conectivo — lo que mantiene unido un cuerpo. Vazivo hace lo mismo en retail: conecta la sede, las regiones, las tiendas, los equipos, las tareas y los resultados en un solo flujo. Un solo lugar para convertir instrucciones en ejecución — no es una caja ni un sistema de stock."
    problems:
      title: "Deje de gestionar tiendas por chat y hojas de cálculo."
      p1_title: "Las tareas se pierden"
      p1_body: "Las instrucciones viven en chats, correos y hojas de cálculo. Las tiendas no comparten una misma idea de «hecho»."
      p2_title: "Los responsables persiguen todo el día"
      p2_body: "Los recordatorios sustituyen a las prioridades. Nadie tiene una sola lista para hoy."
      p3_title: "La sede no tiene visibilidad"
      p3_body: "Cuesta ver qué tiendas terminaron, cuáles van con retraso y dónde intervenir. Vazivo lo conecta todo."
    walkthrough:
      title: "De las instrucciones a la ejecución."
      example: "Tienda Norte y Tienda Centro enviaron la foto. Tienda Este todavía no."
      step1: "Planificar"
      step1_body: "La sede define lo que importa para la red: una nota, una tarea o una checklist, para una tienda, una ciudad o una región."
      step2: "Asignar"
      step2_body: "Las tiendas y las personas adecuadas reciben una lista clara. Apertura, cierre, promo, visita: las plantillas están listas."
      step3: "Ejecutar"
      step3_body: "Los equipos hacen el trabajo en el sitio, en el teléfono. Si se corta la red, la checklist se termina igual y se sincroniza cuando vuelve."
      step4: "Verificar"
      step4_body: "Las fotos y el avance muestran lo hecho — y lo que falta. La sede y la región ven a qué tiendas hacer seguimiento."
    benefits:
      title: "Lo que cambia cuando las operaciones están conectadas"
      b1_title: "Cada tarea. Cada tienda."
      b1_body: "Envíe una nota, una tarea o una checklist a una tienda, una ciudad o una región. Plantillas listas para apertura, cierre, promo y visitas."
      b2_title: "Sepa lo que realmente pasó."
      b2_body: "Avance, fotos y notas en cada punto. Se acabó preguntar «¿está hecho?»."
      b3_title: "Una sola vista de todas las ubicaciones."
      b3_body: "Vea el avance por tienda y por región sin llamar a cada local."
    roles:
      title: "El mensaje adecuado para cada rol"
      hq_title: "Sede y dirección"
      hq_body: "Estandarice las operaciones en todas las ubicaciones — y sepa lo que pasa en cada tienda."
      region_title: "Responsables regionales"
      region_body: "Gestione decenas de tiendas sin perseguir a nadie."
      store_title: "Equipos de tienda"
