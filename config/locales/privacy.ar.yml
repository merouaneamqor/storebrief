      sections:
        - title: "ملفات ضرورية"
          paragraphs:
            - "تُمكّن تسجيل الدخول وأمان الجلسة واختيار اللغة."
          list:
            - "ملف جلسة Rails"
            - "تفضيل اللغة (جلسة)"
        - title: "تخزين محلي"
          paragraphs:
            - "قد يخزن التطبيق بيانات تقنية على الجهاز (موافقة الكوكيز أو قوائم offline عند التفعيل)."
        - title: "خدمات طرف ثالث"
          paragraphs:
            - "قد تُحمّل الخطوط من Google Fonts. لا نضع كوكيز إعلانية على صفحات التسويق."
    sections:
      - title: "المسؤول عن المعالجة"
        paragraphs:
          - "في حسابات المتاجر، المُشغّل عادةً مسؤول عن بيانات الموظفين. %{processor} معالج تقني لمنصة Vazivo."
          - "في طلبات العرض، %{processor} مسؤول عن بيانات الاتصال المرسلة."
        list: []
      - title: "الأغراض والأسس القانونية"
        paragraphs:
          - "تقديم الخدمة، الأمان، فوترة القنوات المدفوعة، والرد على الطلبات."
          - "تنفيذ العقد، خطوات ما قبل التعاقد، الالتزامات القانونية، والموافقة عند اللزوم (عرض، واتساب، إشعارات)."
        list: []
      - title: "فئات البيانات"
        paragraphs:
          - "الهوية والاتصال، بيانات الاستخدام، سجلات تقنية وإشعارات."
        list: []
      - title: "الاحتفاظ"
        paragraphs:
          - "طوال مدة عقد المتجر والاحتياجات التشغيلية أو القانونية."
        list: []
      - title: "المستلمون"
        paragraphs:
          - "مستخدمون مخولون، %{processor}، ومزودون بعقود متوافقة مع القانون 09-08."
        list: []
      - title: "نقل خارج المغرب"
        paragraphs:
          - "يجب الامتثال للمواد 43 و44 (حماية مناسبة وترخيص CNDP عند الحاجة)."
        list: []
      - title: "الأمان"
        paragraphs:
          - "تدابير تقنية وتنظيمية: كلمات مرور مشفرة، عزل بين المتاجر، وصول محدود."
        list: []
      - title: "حقوقك"
        paragraphs:
          - "الوصول والتصحيح والاعتراض بموجب القانون 09-08. اتصل: %{contact}."
          - "يمكنك أيضاً تقديم شكوى إلى CNDP."
        list: []
      - title: "تصريحات CNDP"
        paragraphs:
          - "يجب على المسؤولين في المغرب التصريح أو طلب الترخيص المسبق من CNDP حسب طبيعة البيانات."
        list: []
