    trust:
      title: "النسيج الضام للتجزئة."
      body: "في التشيكية، vazivo تعني النسيج الضام — ما يربط الجسد ببعضه. وفازيفو يفعل الشيء نفسه للتجزئة: يربط المقر والمناطق والمتاجر والفرق والمهام والنتائج في مسار عمل واحد. مكان واحد لتحويل التعليمات إلى تنفيذ — ليس صندوقاً ولا نظام مخزون."
    problems:
      title: "توقفوا عن إدارة المتاجر عبر المحادثات وجداول البيانات."
      p1_title: "المهام تضيع"
      p1_body: "التعليمات موزعة بين المحادثات والبريد والجداول. المتاجر لا تتفق على معنى «تم»."
      p2_title: "المديرون يلاحقون طوال اليوم"
      p2_body: "المتابعات تحلّ محل الأولويات. لا أحد يملك قائمة واحدة لليوم."
      p3_title: "المقر يفتقد الرؤية"
      p3_body: "من الصعب معرفة أي المتاجر أنهت، وأيها متأخرة، وأين يجب التدخل. فازيفو يربط كل ذلك."
    walkthrough:
      title: "من التعليمات إلى التنفيذ."
      example: "متجر الشمال ومتجر الوسط أرسلا الصورة. متجر الشرق لم يرسلها بعد."
      step1: "التخطيط"
      step1_body: "المقر يحدد ما يهم الشبكة: خبر أو مهمة أو قائمة تحقق، لمتجر أو مدينة أو منطقة."
      step2: "التوزيع"
      step2_body: "المتاجر والأشخاص المعنيون يتلقون قائمة واضحة. افتتاح، إغلاق، عرض، زيارة: النماذج جاهزة."
      step3: "التنفيذ"
      step3_body: "الفرق تنجز العمل في المكان، على الهاتف. إذا انقطعت الشبكة، تُنجز القائمة وتُزامَن حالما تعود."
      step4: "التحقق"
      step4_body: "الصور ونسبة الإنجاز تُظهر ما تم — وما تبقّى. المقر والمنطقة يرون أي المتاجر يجب متابعتها."
    benefits:
      title: "ما يتغيّر حين تكون العمليات مترابطة"
      b1_title: "كل مهمة. كل متجر."
      b1_body: "أرسلوا خبراً أو مهمة أو قائمة تحقق إلى متجر أو مدينة أو منطقة. نماذج جاهزة للافتتاح والإغلاق والعروض والزيارات."
      b2_title: "اعرفوا ما حدث فعلاً."
      b2_body: "الإنجاز والصور والملاحظات على كل بند. لا حاجة بعد الآن للسؤال «هل تم؟»."
      b3_title: "رؤية واحدة لكل المواقع."
      b3_body: "تابعوا التقدم حسب المتجر والمنطقة دون الاتصال بكل موقع."
    roles:
      title: "الرسالة المناسبة لكل دور"
      hq_title: "المقر والإدارة"
      hq_body: "وحّدوا العمليات في كل المواقع — واعرفوا ما يحدث في كل متجر."
      region_title: "مديرو المناطق"
      region_body: "أديروا عشرات المتاجر دون ملاحقة الناس."
      store_title: "فرق المتاجر"
      store_body: "اعرفوا بالضبط ما يجب إنجازه اليوم. عمل اليوم في مكان واحد."
    demo:
      title: "شاهدوه على شبكتكم"
      lede: "قولوا لنا كم متجراً تديرون. نتتبّع معكم تعليمة حقيقية حتى الدليل."
      point1: "التنظيم والتوزيع"
      point2: "التنفيذ على هاتف المتجر"
      point3: "متابعة الإنجاز في كل المواقع"
