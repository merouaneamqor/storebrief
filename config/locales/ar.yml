      title: "هذا ليس صندوقاً. هذا عمل المتجر."
      body: "ترسلون التعليمة إلى المتاجر المعنية. ينجزها الفريق على الهاتف، مع الصورة. يرى المقر من أنهى، ومن يجب الاتصال به. المبيعات والمخزون يبقيان في أدواتكم."
    problems:
      title: "ما يزال يحدث في شبكات كثيرة"
      p1_title: "التعليمة تخرج. لا تعرفون من رآها."
      p1_body: "مجموعات وبريد ورسائل المناطق: المعلومة تدور. متجر مراكش لا يملك بالضرورة نفس النسخة التي عند متجر طنجة."
      p2_title: "المعيار يعتمد على من هو في الوردية."
      p2_body: "افتتاح، واجهة، عرض، نظافة. بلا قائمة بسيطة وصورة، تكتشفون الفرق بعد فوات الأوان."
      p3_title: "تديرون بالهاتف، متجراً بعد متجر."
      p3_body: "المديرون يتابعون. المقر ينتظر. لا أحد يملك نفس قائمة ما أُنجز وما تبقّى."
    walkthrough:
      title: "من التعليمة إلى الدليل، في اليوم نفسه"
      example: "المعاريف وأكدال أرسلا الصورة. طنجة لم تُرسلها بعد."
      step1: "تقولون ما يهم"
      step1_body: "خبر أو مهمة، بلغة الفريق، لمتجر أو مدينة أو منطقة."
      step2: "المتجر لديه قائمة واضحة"
      step2_body: "افتتاح، إغلاق، عرض، زيارة: النموذج جاهز. الفريق يؤشّر ويصوّر."
      step3: "العمل يتم في المكان"
      step3_body: "على الهاتف. إذا انقطعت الشبكة، تُنجز القائمة وتعود حالما ترجع."
      step4: "ترون من أنهى"
      step4_body: "المقر والمنطقة يريان المتاجر في الموعد، وتلك التي يجب الاتصال بها هذا الصباح."
    benefits:
      title: "ما ترونه من الأسبوع الأول"
      b1_title: "التعليمة الصحيحة، للمتاجر الصحيحة"
      b1_body: "متجر، أو مدينة، أو منطقة. بالفرنسية وبالعربية. لا رسالة تضيع في مجموعة."
      b2_title: "القائمة في اليد"
      b2_body: "افتتاح، واجهة، عرض، زيارة. الفريق يؤشّر على الهاتف. إذا انقطعت الشبكة، يصعد العمل حالما تعود."
      b3_title: "الصورة تحسم"
      b3_body: "لا تعيدون السؤال «هل تم؟». ترون الواجهة، والمتاجر التي ما تزال تنتظر."
    roles:
      title: "لكل واحد ما يحتاجه"
      hq_title: "الإدارة والمقر"
      hq_body: "تعليمة واحدة للمتاجر المعنية، ودليل أن المعيار محترم."
