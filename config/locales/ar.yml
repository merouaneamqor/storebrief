      cta: "احجزوا عرضاً"
    fits:
      title: "إذا كان هذا صباحكم"
      lede: "عدة متاجر، وإجراءات تتكرر، وفريق في المقر أو في المنطقة."
      more: "شاهدوا الصيغ الأخرى"
    faq:
      title: "قبل الحجز"
      q1: "هل هذا صندوق أو مخزون؟"
      a1: "لا. StoreBrief يرسل التعليمة وقائمة التحقق والصورة. لا يقبض مالاً، ولا يعدّ المخزون، ولا يحلّ محل المحاسبة."
      q2: "هل تستطيع الفرق استخدامه بالعربية؟"
      a2: "نعم. تكتبون التعليمة نفسها بالفرنسية والعربية. العربية تُعرض من اليمين إلى اليسار."
      q3: "وماذا إذا لم تكن للمتجر شبكة؟"
      a3: "يستطيع الفريق إنهاء القائمة على الهاتف. تُرسل حين تعود الشبكة."
      q4: "ماذا نفعل، عملياً، أثناء العرض؟"
      a4: "ثلاثون دقيقة. نأخذ تعليمة ترسلونها أصلاً، نعرضها على هاتف المتجر، ونريكم أي المتاجر تتصلون بها."
      q5: "هل يجب تثبيته في كل الشبكة؟"
      a5: "لا. نبدأ بإجراء واحد ومجموعة صغيرة من المتاجر. أنتم تقررون بعد ذلك."
    prospects:
      title: "الصيغ المناسبة"
      lede: "StoreBrief الأنسب لتجار التجزئة الذين لديهم عدة فروع، وإجراءات تتكرر، وفريق في المقر أو في العمليات الجهوية."
      strongest: "حيث يكون أوضح"
      adjacent_title: "يناسب أيضاً"
      close: "الأبسط للبدء: الغذاء أو الأزياء أو التجميل أو الامتياز، مع فريق في المقر أو في المنطقة. ننطلق من تعليمة، وقائمة تحقق، وصورة."
      items:
        - title: "السوبرماركت وسلاسل البقالة"
          body: "فحوصات المتجر، والعروض، والنظافة، ومهام سلامة الغذاء، والدليل بالصورة."
        - title: "الأزياء والملابس"
          body: "معايير العرض، وإطلاق الحملات، وعرض المجموعات الجديدة، وزيارات المتاجر."
        - title: "التجميل ومستحضرات العناية"
          body: "عروض المنتجات، وحملات الإطلاق، وتوجيه الفرق، وفحوصات الالتزام."
        - title: "الإلكترونيات والأجهزة"
          body: "تجهيز المنتجات، وتعليمات العروض، وتدقيق المتاجر، والإبلاغ عن المشاكل."
        - title: "الأثاث ومستلزمات المنزل"
          body: "معايير قاعة العرض، وفحص الواجهات، والإبلاغ عن مشاكل التسليم أو الصيانة."
        - title: "الصيدليات وسلاسل الصحة والتجميل"
          body: "قوائم تشغيل، وتواصل مع الفرق، وتفتيش المتاجر."
        - title: "متاجر الحي ومحلات محطات الوقود"
          body: "فحوصات الافتتاح والإغلاق، والعروض، وتفتيش المواقع."
        - title: "الرياضة والأحذية"
          body: "حملات الموسم، والعرض البصري، ومتابعة مهام المتجر."
        - title: "الاتصالات ومحلات الهاتف"
          body: "تعليمات الحملات، ومعايير العرض، والمتابعة على مستوى الفرع."
        - title: "شبكات الامتياز"
          body: "إجراءات واتصالات موحّدة عبر مواقع تُدار بشكل مستقل."
      adjacent:
        - title: "المطاعم السريعة والمقاهي"
          body: "قوائم يومية، وإطلاقات، ونظافة، وتفتيش المواقع."
        - title: "الفنادق والخدمات متعددة المواقع"
          body: "مهام الفرق، والتفتيش، والاتصالات التشغيلية."
