      title: "المقر يقرر. المتجر ينفّذ. أنتم ترون الاثنين."
      body: "StoreBrief للشبكات التي لها مناطق ومعايير، ورسائل تضيع بينهما. نريكم ذلك على تعليماتكم أنتم."
    problems:
      title: "ما يزال يحدث في شبكات كثيرة"
      p1_title: "التعليمة تخرج. لا تعرفون من رآها."
      p1_body: "مجموعات وبريد ورسائل المناطق: المعلومة تدور. متجر مراكش لا يملك بالضرورة نفس النسخة التي عند متجر طنجة."
      p2_title: "المعيار يعتمد على من هو في الوردية."
      p2_body: "افتتاح، واجهة، عرض، نظافة. بلا قائمة بسيطة وصورة، تكتشفون الفرق بعد فوات الأوان."
      p3_title: "تديرون بالهاتف، متجراً بعد متجر."
      p3_body: "المديرون يتابعون. المقر ينتظر. لا أحد يملك نفس قائمة ما أُنجز وما تبقّى."
    walkthrough:
      title: "من التعليمة إلى الدليل، في اليوم نفسه"
      step1: "تقولون ما يهم"
      step1_body: "خبر أو مهمة، بلغة الفريق، لمتجر أو مدينة أو منطقة."
      step2: "المتجر لديه قائمة واضحة"
      step2_body: "افتتاح، إغلاق، عرض، زيارة: النموذج جاهز. الفريق يؤشّر ويصوّر."
      step3: "العمل يتم في المكان"
      step3_body: "على الهاتف. إذا انقطعت الشبكة، تُنجز القائمة وتعود حالما ترجع."
      step4: "ترون من أنهى"
      step4_body: "المقر والمنطقة يريان المتاجر في الموعد، وتلك التي يجب الاتصال بها هذا الصباح."
    features:
      title: "ما تكسبه فرقكم"
      available: "من الأسبوع الأول"
      planned: "بعد ذلك، حين تريدون الذهاب أبعد"
      f1: "كل موظف يعمل بلغته، دون دليل استعمال."
      f2: "مهمة اليوم تظهر على الهاتف، حتى حين تكون الشبكة ضعيفة."
      f3: "المتجر يرسل الصورة. أنتم ترون إن كانت الواجهة أو العرض أو المعيار في مكانه."
      f4: "تخاطبون متجراً أو مدينة أو منطقة كاملة. لا الشبكة كلها دفعة واحدة."
      f5: "تُنجز قائمة التحقق في المتجر حتى دون اتصال، وتصعد حالما تعود الشبكة."
      f6: "رسالة قصيرة تنبّه الفريق أن مهمة بانتظاره، مع الرابط لإنجازها في StoreBrief."
      f7: "تعليمات مختلفة حسب المنطقة، مع متابعة بالصور حتى آخر متجر."
      f8: "تدريب قصير للانضمام وللإجراءات الجديدة، مع من أنهى ومن لم يُنهٍ."
    roles:
      title: "لكل واحد ما يحتاجه"
      hq_title: "الإدارة والمقر"
      hq_body: "تعليمة واحدة للمتاجر المعنية، ودليل أن المعيار محترم."
      region_title: "مديرو المناطق"
      region_body: "تعرفون أي المتاجر أنهت، وأيها تتصلون به قبل الظهر."
      store_title: "فرق المتاجر"
      store_body: "أولويات اليوم بلغتهم، دون البحث عنها في مجموعة."
    demo:
      title: "شاهدوه على شبكتكم"
      lede: "قولوا لنا كم متجراً لديكم. نريكم المسار باللغة التي تختارونها، بتعليماتكم."
      point1: "تعليماتكم، بلغة كل فريق"
      point2: "قائمة التحقق بالصورة، على هاتف المتجر"
      point3: "المتابعة: في الموعد، قيد الانتظار، للمكالمة"
      name: "الاسم"
      company: "العلامة"
      email: "البريد المهني"
      phone: "الهاتف"
      stores: "عدد المتاجر"
      language: "لغة العرض"
      submit: "أريد أن أرى عرضاً"
      success: "شكراً. نعود إليكم لتحديد موعد العرض."
      contact_hint: "بريد أو هاتف يكفي لنتصل بكم."
    footer:
      tagline: "المقر يرسل. المتجر ينفّذ. أنتم ترون الدليل."
    resources:
      title: "ستتعرّفون على شبكتكم."
      lede: "مقر، مناطق، ومعايير يجب أن تُحترم كل صباح. وتعليمات ما تزال تضيع في المجموعات."
      fits_title: "أربع شبكات. اليوم نفسه."
      fit1_kicker: "الغذاء"
      fit1_title: "الافتتاح تم. وأنتم ترونه."
      fit1_body: "العرض والنظافة والترفيف: الصورة تصعد قبل أن يحتاج المدير إلى الاتصال."
      fit2_kicker: "الأزياء والتجميل"
      fit2_title: "الواجهة في مكانها، أو تعرفون ذلك قبل الظهر."
      fit2_body: "الحملة والعرض، متجراً بمتجر. الصورة هي ما يُغلق النقاش."
      fit3_kicker: "المطاعم"
      fit3_title: "الإجراء يصمد، حتى دون شبكة."
      fit3_body: "الافتتاح والإغلاق يُنجزان على هاتف المتجر، ثم يصعدان حالما تعود الشبكة."
      fit4_kicker: "الامتياز"
      fit4_title: "التعليمة نفسها، من طنجة إلى الكويرة."
      fit4_body: "كل التراب الوطني، تعليمة واحدة. ترون من التزم، من الشمال إلى الجنوب."
      demo_title: "في العرض، نعيد صباحكم."
      demo_lede: "تعليمة ترسلونها أصلاً، بلغة المتجر، حتى الصورة."
      d1: "ترسلون"
      d1_body: "تعليمة حقيقية، إلى منطقة، بلغة ذلك الفريق."
      d2: "المتجر يجيب"
      d2_body: "الفريق يؤشّر على الهاتف ويرفق الصورة."
      d3: "ترون من تتابعون"
      d3_body: "في الموعد، قيد الانتظار، للاتصال. القائمة نفسها للمقر وللمنطقة."
      close_title: "ثلاثون دقيقة. تعليماتكم. لغتهم."
      close_body: "قولوا لنا كم متجراً لديكم. نريكم المسار على شبكتكم."
      cta: "احجزوا عرضاً"
    prospects:
      title: "الأنسب"
      lede: "StoreBrief الأنسب لتجار التجزئة الذين لديهم عدة فروع، وإجراءات تتكرر، وفريق في المقر أو في العمليات الجهوية."
      strongest: "أفضل الآفاق"
      adjacent_title: "فرص قريبة"
      close: "مجموعات الغذاء والأزياء والتجميل والامتياز، حين تدير مواقع كثيرة، هي أوضح توافق — للاتصالات والحملات والنماذج وقوائم التحقق والتقارير."
      items:
        - title: "السوبرماركت وسلاسل البقالة"
          body: "فحوصات المتجر، والعروض، والنظافة، ومهام سلامة الغذاء، والدليل بالصورة."
        - title: "الأزياء والملابس"
          body: "معايير العرض، وإطلاق الحملات، وعرض المجموعات الجديدة، وزيارات المتاجر."
        - title: "التجميل ومستحضرات العناية"
          body: "عروض المنتجات، وحملات الإطلاق، وتوجيه الفرق، وفحوصات الالتزام."
        - title: "الإلكترونيات والأجهزة"
          body: "تجهيز المنتجات، وتعليمات العروض، وتدقيق المتاجر، والإبلاغ عن المشاكل."
        - title: "الأثاث ومستلزمات المنزل"
          body: "معايير قاعة العرض، وفحص الواجهات، والإبلاغ عن مشاكل التسليم أو الصيانة."
        - title: "الصيدليات وسلاسل الصحة والتجميل"
          body: "قوائم تشغيل، وتواصل مع الفرق، وتفتيش المتاجر."
        - title: "متاجر الحي ومحلات محطات الوقود"
          body: "فحوصات الافتتاح والإغلاق، والعروض، وتفتيش المواقع."
        - title: "الرياضة والأحذية"
          body: "حملات الموسم، والعرض البصري، ومتابعة مهام المتجر."
        - title: "الاتصالات ومحلات الهاتف"
          body: "تعليمات الحملات، ومعايير العرض، والمتابعة على مستوى الفرع."
        - title: "شبكات الامتياز"
          body: "إجراءات واتصالات موحّدة عبر مواقع تُدار بشكل مستقل."
      adjacent:
        - title: "المطاعم السريعة والمقاهي"
          body: "قوائم يومية، وإطلاقات، ونظافة، وتفتيش المواقع."
        - title: "الفنادق والخدمات متعددة المواقع"
          body: "مهام الفرق، والتفتيش، والاتصالات التشغيلية."
