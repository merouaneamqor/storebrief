    faq:
      title: "قبل الحجز"
      q1: "هل هذا صندوق أو نظام مخزون؟"
      a1: "لا. Vazivo ينظّم التعليمات وقوائم التحقق والدليل بالصورة. لا يقبض مالاً، ولا يعدّ المخزون، ولا يحلّ محل المحاسبة."
      q2: "ما اللغات المتاحة؟"
      a2: "التطبيق متاح بالفرنسية والإنجليزية والإسبانية والعربية. تُكتب التعليمات بالفرنسية والعربية، والعربية تُعرض من اليمين إلى اليسار."
      q3: "وماذا إذا لم تكن لمتجر شبكة؟"
      a3: "يستطيع الفريق إنهاء القائمة على الهاتف. تُزامَن حالما تعود الشبكة."
      q4: "ماذا يحدث أثناء العرض؟"
      a4: "ثلاثون دقيقة. نأخذ تعليمة ترسلونها أصلاً، ننفذها على هاتف متجر، ونريكم أي المتاجر أنهت وأيها تحتاج متابعة."
      q5: "هل يجب تثبيته في كل الشبكة؟"
      a5: "لا. نبدأ بإجراء واحد ومجموعة صغيرة من المتاجر. أنتم تقررون بعد ذلك."
    prospects:
