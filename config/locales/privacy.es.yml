      page_title: "Cookies y almacenamiento"
      lede: "Limitamos los rastreadores a lo necesario para el servicio."
      banner:
        title: "Cookies esenciales"
        body: "Usamos cookies de sesión y de idioma. Consulte nuestra %{privacy_link} y %{cookies_link}."
        accept: "Entendido"
      sections:
        - title: "Cookies estrictamente necesarias"
          paragraphs:
            - "Permiten autenticación, seguridad de sesión y elección de idioma."
          list:
            - "Cookie de sesión Rails"
            - "Preferencia de idioma (sesión)"
        - title: "Almacenamiento local"
          paragraphs:
            - "La app puede guardar datos técnicos en el dispositivo (consentimiento de cookies o colas offline de checklists si está activo)."
        - title: "Servicios de terceros"
          paragraphs:
            - "Las fuentes pueden cargarse desde Google Fonts. Vazivo no usa cookies publicitarias en la web marketing."
    sections:
      - title: "Responsable del tratamiento"
        paragraphs:
          - "En cuentas de enseña, el empleador es en principio responsable. %{processor} actúa como encargado técnico de la plataforma Vazivo."
          - "En solicitudes de demo, %{processor} es responsable de los datos de contacto enviados."
        list: []
      - title: "Finalidades y bases legales"
        paragraphs:
          - "Prestación del servicio, seguridad, facturación de canales de pago y respuesta a solicitudes."
          - "Ejecución contractual, medidas precontractuales, obligaciones legales y, cuando proceda, consentimiento (demo, WhatsApp, push)."
        list: []
      - title: "Categorías de datos"
        paragraphs:
          - "Identidad y contacto, datos de uso, registros técnicos y de notificación."
        list: []
      - title: "Conservación"
        paragraphs:
          - "Durante el contrato con la enseña y según necesidades operativas o legales."
        list: []
      - title: "Destinatarios"
        paragraphs:
          - "Usuarios autorizados, %{processor} y proveedores con acuerdos conformes a la ley 09-08."
        list: []
      - title: "Transferencias fuera de Marruecos"
        paragraphs:
          - "Deben cumplir los artículos 43 y 44 de la ley 09-08 (protección adecuada y autorización CNDP si aplica)."
        list: []
      - title: "Seguridad"
        paragraphs:
          - "Medidas técnicas y organizativas: contraseñas cifradas, aislamiento multi-enseña, acceso restringido."
        list: []
      - title: "Sus derechos"
        paragraphs:
          - "Acceso, rectificación y oposición según la ley 09-08. Contacto: %{contact}."
          - "También puede reclamar ante la CNDP."
        list: []
      - title: "Declaraciones CNDP"
        paragraphs:
          - "Los responsables en Marruecos deben declarar o solicitar autorización previa a la CNDP según la naturaleza de los datos."
        list: []
