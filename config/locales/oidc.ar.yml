ar:
  oidc:
    title: "تسجيل الدخول OpenID Connect"
    help: "اضبط جهة الإصدار والعميل ونقاط HTTPS التي يوفرها مزود الهوية. يجب على مسؤول المنصة تفعيل ميزة OIDC."
    policy: "يسمح بالدخول للهويات المتحقق منها فقط. ترفض الحسابات دون تطابق وتسحب صلاحيات SSO السابقة. تبقى العضويات اليدوية دون تغيير. تتطلب حسابات المقر الافتراضية ربطا صريحا للهوية."
    callback: "سجل عنوان العودة هذا بدقة لدى المزود"
    secret_help: "يشفر السر ولا يعرض أبدا. اترك الحقل فارغا للاحتفاظ بالقيمة المحفوظة."
    mapping_help: "اربط قيمة مطالبة موقعة بوحدة ودور وظيفي أو بدور مخصص. لا تنشئ المجموعات صلاحيات المقر الافتراضية أبدا."
    save: "حفظ"
    saved: "تم الحفظ."
    links: "روابط الهوية"
    link_help: "اربط الحساب الموجود بمعرف صاحب الهوية الدقيق قبل دخوله الأول، خصوصا مسؤولي المقر. يجب تطابق البريد الإلكتروني المتحقق منه. يلغي فك الربط صلاحيات SSO المدارة فقط."
    user: "المستخدم"
    subject: "معرف صاحب الهوية"
    link: "ربط الهوية"
    unlink: "فك ربط الهوية"
    invalid_link: "الهوية أو الحساب مرتبط بالفعل أو الرابط غير صالح."
    sign_in: "الدخول عبر OpenID Connect"
    fields:
      enabled: "تفعيل OIDC"
      sso_enforced: "فرض SSO بدلا من كلمة المرور"
      jit_enabled: "السماح بإنشاء الحساب عند الدخول الأول"
      issuer: "عنوان جهة الإصدار"
      client_id: "معرف العميل"
      client_secret: "سر العميل"
      authorization_endpoint: "نقطة التفويض"
      token_endpoint: "نقطة الرموز"
