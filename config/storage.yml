test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Amazon S3 (or S3-compatible via AWS_S3_ENDPOINT).
# Set ACTIVE_STORAGE_SERVICE=amazon and provide:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_S3_BUCKET
# Optional: AWS_S3_ENDPOINT, AWS_S3_FORCE_PATH_STYLE=true (MinIO / LocalStack)
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "eu-west-3") %>
  bucket: <%= ENV["AWS_S3_BUCKET"] %>
  public: false
  upload:
    server_side_encryption: "AES256"
  <% if ENV["AWS_S3_ENDPOINT"].present? %>
  endpoint: <%= ENV["AWS_S3_ENDPOINT"] %>
  force_path_style: <%= ENV.fetch("AWS_S3_FORCE_PATH_STYLE", "true") %>
  <% end %>
